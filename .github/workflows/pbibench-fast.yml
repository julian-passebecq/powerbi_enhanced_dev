name: PbiBench fast gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-and-toolbox:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/PbiBench.V11.Tests/PbiBench.V11.Tests.csproj -f net10.0 --nologo
      - run: dotnet build src/PbiBench.FabricToolbox/PbiBench.FabricToolbox.csproj --nologo
      - run: dotnet test tests/PbiBench.FabricToolbox.Tests/PbiBench.FabricToolbox.Tests.csproj --nologo
      - run: dotnet test tests/PbiBench.V2.Tests/PbiBench.V2.Tests.csproj -f net10.0 --nologo
      - run: dotnet build src/PbiBench.ReportStudio/PbiBench.ReportStudio.csproj --nologo
      - run: ./scripts/test-process-isolation.ps1 -Configuration Debug
      - name: ExternalTools contract and boundary tests
        run: dotnet test tests/PbiBench.ExternalTools.Tests/PbiBench.ExternalTools.Tests.csproj --nologo
      - name: DesignExchange contract and boundary tests
        run: dotnet test tests/PbiBench.DesignExchange.Tests/PbiBench.DesignExchange.Tests.csproj --nologo
      - name: ReportStudio contract and boundary tests
        run: dotnet test tests/PbiBench.ReportStudio.Tests/PbiBench.ReportStudio.Tests.csproj --nologo
      # Offline coverage only; no hosted live TE2/Desktop/XMLA/Fabric claim.
