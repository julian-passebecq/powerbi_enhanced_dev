name: PbiBench Windows Release gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-modules:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release portable tests (recovery, export, provenance and boundaries)
        run: dotnet test tests/PbiBench.V11.Tests/PbiBench.V11.Tests.csproj -c Release -f net10.0 --nologo --logger "trx;LogFileName=v11-net10.trx" --results-directory artifacts/ci-release
      - name: Release net48 module tests (no TE2 runtime required)
        run: dotnet test tests/PbiBench.V11.Tests/PbiBench.V11.Tests.csproj -c Release -f net48 --nologo --logger "trx;LogFileName=v11-net48.trx" --results-directory artifacts/ci-release
      - name: Release Fabric Toolbox build
        run: dotnet build src/PbiBench.FabricToolbox/PbiBench.FabricToolbox.csproj -c Release --nologo
      - name: Release Fabric Toolbox WPF tests (offline)
        run: dotnet test tests/PbiBench.FabricToolbox.Tests/PbiBench.FabricToolbox.Tests.csproj -c Release --nologo --logger "trx;LogFileName=toolbox-net10.trx" --results-directory artifacts/ci-release
      - name: Release V2 tests
        run: dotnet test tests/PbiBench.V2.Tests/PbiBench.V2.Tests.csproj -c Release -f net10.0 --nologo --logger "trx;LogFileName=v2-net10.trx" --results-directory artifacts/ci-release
      - name: Release Report Studio build
        run: dotnet build src/PbiBench.ReportStudio/PbiBench.ReportStudio.csproj -c Release --nologo
      - name: Isolated process outputs
        run: ./scripts/test-process-isolation.ps1 -Configuration Release
      - name: Offline Report Studio WPF smoke
        run: ./scripts/invoke-report-smoke.ps1 -Configuration Release
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbibench-windows-release-evidence
          path: |
            artifacts/ci-release/*.trx
            artifacts/ci-release/report-smoke*
          if-no-files-found: warn
      - name: ExternalTools contract and boundary tests
        run: dotnet test tests/PbiBench.ExternalTools.Tests/PbiBench.ExternalTools.Tests.csproj -c Release --nologo
      - name: DesignExchange contract and boundary tests
        run: dotnet test tests/PbiBench.DesignExchange.Tests/PbiBench.DesignExchange.Tests.csproj -c Release --nologo
      - name: ReportStudio contract and boundary tests
        run: dotnet test tests/PbiBench.ReportStudio.Tests/PbiBench.ReportStudio.Tests.csproj -c Release --nologo
      # Offline coverage only; no hosted live TE2/Desktop/XMLA/Fabric claim.
