name: V11 portable and Fabric fast gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  portable-and-toolbox:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/PbiBench.V11.Tests/PbiBench.V11.Tests.csproj -f net10.0 --nologo
      - run: dotnet build src/PbiBench.FabricToolbox/PbiBench.FabricToolbox.csproj --nologo
      # Intentionally excludes the pinned TE2 build, net48 native tests, main WPF
      # compile/smoke and packaging. scripts/invoke-v11-gate.ps1 runs those locally
      # with the prebuilt pinned upstream toolchain. No live integration claim.
